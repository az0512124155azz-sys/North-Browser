name: Build North desktop
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create a draft GitHub release when all builds succeed
        type: boolean
        default: false
  push:
    branches: [main]
concurrency:
  group: north-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            label: Windows
          - os: macos-latest
            target: mac
            label: macOS
          - os: ubuntu-latest
            target: linux
            label: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Real Electron UI regression on Windows
        if: matrix.target == 'win'
        run: npm run test:electron
      - name: Upload Electron runtime logs and screenshots
        if: always() && matrix.target == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: North-Windows-Electron-tests
          path: test-results/electron/
          if-no-files-found: error
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: North-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  release:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: North Desktop Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: release-assets/*
