name: Import North source snapshot
on:
  push:
    branches: [main]
    paths: [north-import.part04]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and restore reviewed source files
        run: |
          cat north-import.part01 north-import.part02 north-import.part03 north-import.part04 | base64 -d | xz -d | tar -xf -
          node --check src/main.js
          node --check src/telegram-bot.js
          node --check src/classroom-scanner.js
          node --check src/study-agent.js
          node --test test/study.test.js
      - name: Commit readable source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git rm -f north-import.part01 north-import.part02 north-import.part03 north-import.part04
          git commit -m 'Implement fixed North Telegram bot and internal Classroom scanner'
          git push
