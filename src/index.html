<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://www.google.com data:; img-src 'self' https://www.google.com data:; style-src 'self'; script-src 'self'">
<title>North Browser</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <symbol id="i-compass" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M30.7 17.3 26.2 26.2l-8.9 4.5 4.5-8.9Z" fill="#73c3a9" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="1.9" fill="#172820"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></symbol>
 <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
 <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 7v5h-5M4.8 10a7.5 7.5 0 0 1 13-3l2.2 5M4 17v-5h5m10.2 2a7.5 7.5 0 0 1-13 3L4 12"/></symbol>
 <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></symbol>
 <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4.5h12v16l-6-3.9-6 3.9Z"/></symbol>
 <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></symbol>
 <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 19h16"/></symbol>
 <symbol id="i-settings" viewBox="0 0 24 24"><path d="M10 2h4l.7 2.4 2 1.2 2.5-.6 2 3.5-1.8 1.8v2.4l1.8 1.8-2 3.5-2.5-.6-2 1.2L14 21h-4l-.7-2.4-2-1.2-2.5.6-2-3.5 1.8-1.8v-2.4L2.8 8.5l2-3.5 2.5.6 2-1.2Z"/><circle cx="12" cy="11.5" r="3"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
 <symbol id="i-graduate" viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5Z M6 11v5c3.5 3 8.5 3 12 0v-5M22 9v8"/></symbol>
 <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01"/></symbol>
 <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 8-3 8-3 10h18c0-2-3-2-3-10M10 22h4"/></symbol>
 <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z M22 2 11 13"/></symbol>
 <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15a8 8 0 0 1-11-11A8 8 0 1 0 20 15Z"/></symbol>
 <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
 <symbol id="i-ellipsis" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
</svg>
<div id="application">
 <header class="titlebar">
  <div id="brand" title="North Browser"><svg class="brand-mark"><use href="#i-compass"/></svg><span>North</span></div>
  <div id="tabs" role="tablist" aria-label="Browser tabs"></div>
  <button id="add" class="icon-button new-tab" title="New tab (Ctrl+T)" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
  <div class="window-controls-space" aria-hidden="true"></div>
 </header>
 <div class="toolbar">
  <div class="nav-controls">
   <button id="back" class="icon-button" title="Back"><svg><use href="#i-back"/></svg></button>
   <button id="forward" class="icon-button" title="Forward"><svg><use href="#i-next"/></svg></button>
   <button id="reload" class="icon-button" title="Reload"><svg><use href="#i-reload"/></svg></button>
   <button id="home" class="icon-button" title="New tab"><svg><use href="#i-home"/></svg></button>
  </div>
  <form id="address-form" autocomplete="off">
   <svg class="address-icon"><use href="#i-search"/></svg>
   <input id="address" spellcheck="false" aria-label="Address or Google search" placeholder="Search Google or enter a URL">
   <button type="submit" class="go-button" title="Go" aria-label="Go"><svg><use href="#i-next"/></svg></button>
  </form>
  <div class="actions">
   <button id="bookmarks" class="icon-button" title="Bookmarks"><svg><use href="#i-bookmark"/></svg></button>
   <button id="historyTop" class="icon-button" title="History"><svg><use href="#i-history"/></svg></button>
   <button id="downloadsTop" class="icon-button" title="Downloads"><svg><use href="#i-download"/></svg></button>
   <button id="profile" class="avatar" aria-label="North profile">N</button>
   <button id="more" class="icon-button more" aria-label="Browser menu" aria-expanded="false"><svg><use href="#i-more"/></svg></button>
  </div>
 </div>
 <aside id="rail" aria-label="Browser sidebar">
  <div class="rail-main">
   <button id="railNew" class="rail-action" title="New tab"><svg><use href="#i-plus"/></svg></button>
   <button id="railHistory" class="rail-action" title="History"><svg><use href="#i-history"/></svg></button>
   <button id="railBookmark" class="rail-action" title="Bookmarks"><svg><use href="#i-bookmark"/></svg></button>
   <button id="railDownloads" class="rail-action" title="Downloads"><svg><use href="#i-download"/></svg></button>
   <span class="rail-separator"></span>
   <button id="railSettings" class="rail-action" title="Study Assistant / settings"><svg><use href="#i-settings"/></svg></button>
  </div>
  <button id="railLogo" class="rail-foot" title="North home"><svg><use href="#i-compass"/></svg></button>
 </aside>
 <div id="workspace">
  <section id="bookmarkbar" aria-label="Quick access">
   <button class="bookmark-item" data-site="https://classroom.google.com/"><span class="site-icon"><img alt="" src="https://www.google.com/s2/favicons?domain=classroom.google.com&amp;sz=64"><span class="site-fallback classroom">C</span></span>Classroom</button>
   <button class="bookmark-item" data-site="https://chatgpt.com/"><span class="site-icon"><img alt="" src="https://www.google.com/s2/favicons?domain=chatgpt.com&amp;sz=64"><span class="site-fallback chatgpt">✺</span></span>ChatGPT</button>
   <button class="bookmark-item" data-site="https://students.myofek.cet.ac.il/"><span class="site-icon"><img alt="" src="https://www.google.com/s2/favicons?domain=students.myofek.cet.ac.il&amp;sz=64"><span class="site-fallback ofek">O</span></span>Ofek</button>
   <button class="bookmark-item" data-site="https://www.galim.org.il/"><span class="site-icon"><img alt="" src="https://www.google.com/s2/favicons?domain=galim.org.il&amp;sz=64"><span class="site-fallback galim">G</span></span>Galim</button>
   <button class="bookmark-item" data-site="https://moodle.org/"><span class="site-icon"><img alt="" src="https://www.google.com/s2/favicons?domain=moodle.org&amp;sz=64"><span class="site-fallback moodle">M</span></span>Moodle</button>
   <button id="addBookmark" class="bookmark-add" title="New tab"><svg><use href="#i-plus"/></svg></button>
  </section>
  <main id="homePage">
   <div class="home-hero">
    <div class="hero-brand"><svg class="hero-compass"><use href="#i-compass"/></svg><span>North</span></div>
    <form id="search-form"><svg class="search-glass"><use href="#i-search"/></svg><input id="search" spellcheck="false" placeholder="Search Google or enter a URL" aria-label="Search Google"><button type="submit" class="search-action" aria-label="Search"><svg><use href="#i-next"/></svg></button></form>
    <div id="shortcuts">
     <button data-site="https://classroom.google.com/" class="shortcut"><span class="shortcut-tile"><img alt="" src="https://www.google.com/s2/favicons?domain=classroom.google.com&amp;sz=64"><span class="shortcut-fallback classroom">C</span></span><span>Classroom</span></button>
     <button data-site="https://chatgpt.com/" class="shortcut"><span class="shortcut-tile"><img alt="" src="https://www.google.com/s2/favicons?domain=chatgpt.com&amp;sz=64"><span class="shortcut-fallback chatgpt">✺</span></span><span>ChatGPT</span></button>
     <button data-site="https://students.myofek.cet.ac.il/" class="shortcut"><span class="shortcut-tile"><img alt="" src="https://www.google.com/s2/favicons?domain=students.myofek.cet.ac.il&amp;sz=64"><span class="shortcut-fallback ofek">O</span></span><span>Ofek</span></button>
     <button data-site="https://www.galim.org.il/" class="shortcut"><span class="shortcut-tile"><img alt="" src="https://www.google.com/s2/favicons?domain=galim.org.il&amp;sz=64"><span class="shortcut-fallback galim">G</span></span><span>Galim</span></button>
     <button data-site="https://moodle.org/" class="shortcut"><span class="shortcut-tile"><img alt="" src="https://www.google.com/s2/favicons?domain=moodle.org&amp;sz=64"><span class="shortcut-fallback moodle">M</span></span><span>Moodle</span></button>
    </div>
   </div>
  </main>
 </div>
 <div id="menuScrim" hidden></div>
 <section id="browserMenu" class="popup" hidden aria-label="North menu">
  <div class="menu-group"><button data-action="newtab"><svg><use href="#i-plus"/></svg>New tab <kbd>Ctrl+T</kbd></button><button data-action="newwindow"><svg><use href="#i-plus"/></svg>New window <kbd>Ctrl+N</kbd></button></div>
  <div class="menu-group"><button data-action="history"><svg><use href="#i-history"/></svg>History</button><button data-action="downloads"><svg><use href="#i-download"/></svg>Downloads</button><button data-action="bookmarks"><svg><use href="#i-bookmark"/></svg>Bookmarks</button></div>
  <div class="menu-group"><button data-action="study" class="study-row"><svg><use href="#i-graduate"/></svg>Study Assistant <span class="menu-chevron">‹</span></button><button data-action="settings"><svg><use href="#i-settings"/></svg>Settings</button><button data-action="help"><svg><use href="#i-info"/></svg>Help</button></div>
  <div class="menu-group last-group"><button data-action="exit"><svg><use href="#i-close"/></svg>Exit North</button></div>
 </section>
 <section id="studyMenu" class="popup" hidden aria-label="Study Assistant menu">
  <div class="sub-title"><svg><use href="#i-graduate"/></svg><b>Study Assistant</b><button id="studyClose" class="icon-button" title="Close"><svg><use href="#i-close"/></svg></button></div>
  <button data-action="scan"><svg><use href="#i-search"/></svg><span>Scan for new tasks<small>Check Classroom for new assignments</small></span></button>
  <button data-action="activity"><svg><use href="#i-history"/></svg><span>Scan activity<small>Review recent scan results</small></span></button>
  <button data-action="tasks"><svg><use href="#i-list"/></svg><span>Open scan results<small>Review assignments by class</small></span></button>
  <button data-action="telegram"><svg><use href="#i-send"/></svg><span>Telegram notifications<small>@NorthStudyHelperBot</small></span></button>
  <button data-action="assistant"><svg><use href="#i-settings"/></svg><span>Study settings<small>Local scanner and Qwen</small></span></button>
 </section>
 <div id="notice" role="status" aria-live="polite" hidden></div>
</div>
<script src="./renderer.js"></script>
</body></html>
