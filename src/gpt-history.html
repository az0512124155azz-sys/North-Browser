<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>North — שיחות GPT</title><link rel="stylesheet" href="study-panel.css"><link rel="stylesheet" href="gpt-history.css"></head><body><div class="top"><h1>השיחות שלי עם GPT</h1><p>חומרי המקור, הפרומפטים שאישרת והתשובות — מסודרים לפי שיחה</p></div><div class="workspace"><aside><button id="newChat">שיחה חדשה</button><input id="filter" placeholder="חיפוש לפי שם, כיתה או מספר" aria-label="חיפוש שיחות"><div id="chats"></div></aside><main><div id="empty">בחר שיחה או התחל שיחה חדשה.</div><div id="detail" hidden><div class="line"><input id="title" aria-label="שם השיחה"><button id="rename" class="secondary">שמור שם</button></div><p id="meta"></p><div class="actions"><button id="openGPT">פתח את השיחה ב־ChatGPT</button><button id="recover" class="secondary" hidden>אסוף תשובה קיימת</button></div><div id="files"></div><section id="proposal" hidden><h2>פרומפט לאישור שלך</h2><p id="reason"></p><textarea id="prompt" aria-label="הפרומפט המוצע"></textarea><p id="sendFiles"></p><div class="actions"><button id="savePrompt" class="secondary">שמור עריכה לאישור חדש</button><button id="approve">אשר ושלח ל־GPT</button><button id="cancel" class="secondary">בטל</button></div></section><div id="events"></div><details id="remote"><summary>כל ההודעות שנקלטו מהשיחה באתר</summary><div id="remoteMessages"></div></details><section><label for="request">מה תרצה לעשות או לתקן?</label><textarea id="request" placeholder="כתוב כמו בשיחה רגילה. הפרומפט יוצג לאישורך לפני השליחה."></textarea><button id="prepare">הכן פרומפט לאישור</button></section></div><p id="feedback" role="status"></p></main></div><script src="gpt-history.js"></script></body></html>
